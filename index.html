<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>

    <!-- Bike favicon -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <!-- Our global styles -->
    <link rel="stylesheet" href="global.css" />

    <!-- Mapbox GL JS CSS (needed for the map to display correctly) -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <!-- Our JavaScript, loaded as an ES module -->
    <script src="map.js" type="module"></script>
  </head>
  <body>
    <header>
      <h1>🚲 Bikewatching</h1>

      <!-- Time filter slider -->
      <label>
        Filter by time:
        <input type="range" id="time-slider" min="-1" max="1440" value="-1" />
        <time id="selected-time"></time>
        <em id="any-time">(any time)</em>
      </label>
    </header>

    <!-- The map fills this div; the SVG overlay holds the station circles -->
    <div id="map">
      <svg></svg>
    </div>

    <!-- Legend explaining the circle colors -->
    <div class="legend">
      <div style="--departure-ratio: 1">More departures</div>
      <div style="--departure-ratio: 0.5">Balanced</div>
      <div style="--departure-ratio: 0">More arrivals</div>
    </div>
  </body>
</html>
